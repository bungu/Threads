{id:'yohaku',name:'日々の余白',handle:'hibi.no.yohaku',glyph:'y',style:'sage',enabled:true,days:[0,1,2,3,4,5,6],times:['08:00','20:00'],prompt:'暮らしの中の小さな気づきや、心が軽くなる習慣を発信してください。\n\n・やさしく、自然な話し言葉で\n・具体的なエピソードをひとつ添える\n・120〜200文字を目安に、適度に改行する\n・ハッシュタグと過度な絵文字は使わない\n・最後は、読んだ人に余韻が残る一文で',sample:'いつもより、10分だけ早起き。\n\n急いで飲んでいたコーヒーを、今日は窓のそばでゆっくり味わってみた。\n\n何かを足すより、少しだけ余白をつくる。\nそれだけで、朝の景色が変わることもある。'},
