<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>orbit studio</title></head><body><style>
#ts-studio{--ts-bg:light-dark(#f7f7f4,#171916);--ts-panel:light-dark(#ffffff,#21241f);--ts-nav:light-dark(#efefea,#1b1e19);--ts-ink:light-dark(#282d25,#edf0e9);--ts-sub:light-dark(#72776c,#a4ac9d);--ts-line:light-dark(#e2e5dc,#383e32);--ts-soft:light-dark(#eff3e8,#303a27);--ts-green:light-dark(#526840,#b4cf95);--ts-accent:light-dark(#dfe9ce,#38462c);--ts-button:light-dark(#2e3a26,#dce8cb);--ts-button-text:light-dark(#fbfcf8,#26301f);font:14px/1.6 -apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans JP',sans-serif;color:var(--ts-ink);background:var(--ts-bg);border:1px solid var(--ts-line);border-radius:18px;overflow:hidden;isolation:isolate;--ts-radius:14px}

}#ts-studio .ts-heading h1{font-size:25px;letter-spacing:-.8px;font-weight:600;margin:4px 0 1px}#ts-studio .ts-heading p{font-size:11px;color:var(--ts-sub)}#ts-studio .ts-switch-wrap{display:flex;align-items:center;gap:9px;font-size:11px;white-space:nowrap}#ts-studio .ts-switch{width:34px;height:20px;border-radius:20px;background:var(--ts-line);border:0;padding:3px;display:flex;align-items:center}#ts-studio .ts-switch:after{content:'';width:14px;height:14px;background:var(--ts-panel);border-radius:50%;box-shadow:0 1px 3px #0002;transition:transform .2s}#ts-studio .ts-switch[aria-checked=true]{background:var(--ts-green)}#ts-studio .ts-switch[aria-checked=true]:after{transform:translateX(14px);background:light-dark(#fff,#202b18)}#ts-studio .ts-columns{display:grid;grid-template-columns:minmax(0,1fr) 218px;gap:18px;align-items:start}#ts-studio .ts-editor{display:flex;flex-direction:column;gap:17px;min-width:0}#ts-studio .ts-section{background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:var(--ts-radius);padding:20px}#ts-studio .ts-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:19px}#ts-studio h2{font-size:13px;font-weight:600}#ts-studio .ts-section-title{display:flex;align-items:center;gap:8px}#ts-studio .ts-section-title svg{color:var(--ts-sub)}#ts-studio .ts-small{font-size:10px;color:var(--ts-sub)}#ts-studio .ts-field-label{display:block;font-size:11px;color:var(--ts-sub);margin-bottom:9px}#ts-studio .ts-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:18px}#ts-studio .ts-day{height:34px;min-width:0;padding:0;border:1px solid var(--ts-line);background:var(--ts-panel);border-radius:7px;font-size:11px}#ts-studio .ts-day[aria-pressed=true]{background:var(--ts-soft);border-color:var(--ts-accent);color:var(--ts-green)}#ts-studio .ts-day:hover{border-color:var(--ts-green)}#ts-studio .ts-time-list{display:flex;flex-wrap:wrap;gap:7px}#ts-studio .ts-time-chip{display:flex -studio .ts-orbit:after,#ts-studio .ts-orbit:before{content:'';position:absolute;border:1px solid color-mix(in srgb,var(--ts-green) 18%,transparent);border-radius:50%;inset:13px}#ts-studio .ts-orbit:after{inset:27px}#ts-studio .ts-miniweek{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;border-top:1px solid color-mix(in srgb,var(--ts-green) 18%,transparent);margin-top:15px;padding-top:11px}#ts-studio .ts-mini-day{text-align:center;font-size:9px;color:var(--ts-green)}#ts-studio .ts-mini-dot{height:4px;width:4px;border-radius:50%;margin:6px auto 1px;background:color-mix(in srgb,var(--ts-green) 20%,transparent)}#ts-studio .ts-mini-dot.on{background:var(--ts-green)}#ts-studio .ts-preview-label{display:flex;justify-content:space-between;align-items:center;margin:0 1px 10px;font-size:11px;font-weight:500}#ts-studio .ts-preview-card{padding:17px 15px;background:var(--ts-panel);border:1px solid var(--ts-line);border-radius:var(--ts-radius)}#ts-studio .ts-post-author{display:flex;align-items:center;gap:8px;margin-bottom:15px}#ts-studio .ts-post-author .ts-avatar{width:27px;height:27px;font-size:16px}#ts-studio .ts-post-user{font-size:10px;font-weight:600;overflow-wrap:anywhere}#ts-studio .ts-post-caption{font-size:9px;color:var(--ts-sub)}#ts-studio .ts-post-text{font-size:11px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}#ts-studio .ts-post-actions{display:flex;gap:13px;margin-top:20px;color:var(--ts-sub)}#ts-studio .ts-post-actions svg{width:15px;height:15px}#ts-studio .ts-preview-note{font-size:10px;color:var(--ts-sub);margin-top:10px;line-height:1.8}#ts-studio .ts-savebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding-top:17px;border-top:1px solid var(--ts-line)}#ts-studio .ts-save-status{font-size:11px;color:var(--ts-sub);display:flex;align-items:center;gap:7px}#ts-studio .ts-save-status svg{width:14px;height:14px}#ts-studio .ts-primary{border:0;border-radius:8px;background:var(--t <div id="ts-studio" aria-label="Orbit Threads 管理画面">
<div class="ts-shell">

</div>

</aside>
