const defaults=[
{id:'yohaku',name:'日々の余白',handle:'hibi.no.yohaku',glyph:'y',style:'sage',enabled:true,days:[0,1,2,3,4,5,6],times:['08:00','20:00'],prompt:'暮らしの中の小さな気づきや、心が軽くなる習慣を発信してください。\n\n・やさしく、自然な話し言葉で\n・具体的なエピソードをひとつ添える\n・120〜200文字を目安に、適度に改行する\n・ハッシュタグと過度な絵文字は使わない\n・最後は、読んだ人に余韻が残る一文で',sample:'いつもより、10分だけ早起き。\n\n急いで飲んでいたコーヒーを、今日は窓のそばでゆっくり味わってみた。\n\n何かを足すより、少しだけ余白をつくる。\nそれだけで、朝の景色が変わることもある。'},
{id:'coffee',name:'コーヒーのある日',handle:'coffee.and.days',glyph:'c',style:'clay',enabled:true,days:[0,2,4,6],times:['07:30','15:00'],prompt:'自宅で楽しめるコーヒーの知識や、豆選びのヒントを発信してください。\n\n・初心者にも伝わる、親しみやすい言葉で\n・一投稿につきひとつのテーマ\n・すぐ試せる小さなコツを添える\n・150文字程度、ハッシュタグなし',sample:'コーヒーを淹れる前に、カップを少し温めておく。\n\nほんのひと手間だけれど、最後のひと口まで、ゆっくり楽しめる。\n\n今日の一杯にも、小さな気配りを。'},
{id:'design',name:'デザインのメモ',handle:'design.notes.jp',glyph:'d',style:'ink',enabled:false,days:[0,1,2,3,4],times:['12:00'],prompt:'日常で見つけたデザインの工夫や、制作に役立つ視点を共有してください。\n\n・簡潔で落ち着いた文体\n・具体例から始める\n・専門用語はできるだけ使わない\n・200文字以内にまとめる',sample:'読みやすいメニューには、ちょうどいい「間」がある。\n\n文字を大きくする前に、まず行と行のあいだを少し広げてみる。\n\n伝わり方は、余白でも変えられる。'}];
let accounts=structuredClone(defaults),selected=accounts[0].id,saved=JSON.stringify(accounts),dirty=false;
function validState(s){return s&&Array.isArray(s.accounts)&&s.accounts.length>0&&s.accounts.length<=8&&s.accounts.every(a=>a&&typeof a.id==='string'&&typeof a.name==='string'&&a.name.length<=24&&typeof a.handle==='string'&&/^\w[\w.]{0,29}$/.test(a.handle)&&typeof a.prompt==='string'&&a.prompt.length<=2400&&typeof a.enabled==='boolean'&&Array.isArray(a.days)&&a.days.every(d=>Number.isInteger(d)&&d>=0&&d<7)&&Array.isArray(a.times)&&a.times.every(t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t)));}
function restore(s){if(validState(s)){accounts=structuredClone(s.accounts);selected=accounts.some(a=>a.id===s.selected)?s.selected:accounts[0].id;saved=JSON.stringify(accounts);dirty=false;}}
restore(window.openai?.widgetState?.privateContent);
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{view:'Threadsアカウント管理UI',selectedAccount:current().name,accountCount:accounts.length},privateContent:{accounts:JSON.parse(saved),selected}}).catch(()=>{});}
function current(){return accounts.find(a=>a.id===selected)||accounts[0];}
function icon(name){const i=document.createElement('i');i.setAttribute('data-lucide',name);i.setAttribute('aria-hidden','true');return i;}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function setStatus(message){$('ts-save-status').textContent=message;$('ts-save-state').hidden=!message;}
function mark(){dirty=JSON.stringify(accounts)!==saved;setStatus(dirty?'未保存の変更があります':'保存した設定を表示しています');$('ts-error').hidden=true;}
function renderAccounts(){const box=$('ts-accounts');box.replaceChildren();accounts.forEach(a=>{const b=document.createElement('button');b.className='ts-account';b.setAttribute('aria-pressed',String(a.id===selected));b.setAttribute('aria-label',a.name+'、定期投稿'+(a.enabled?'オン':'オフ'));const avatar=document.createElement('span');avatar.className='ts-avatar';avatar.dataset.style=a.style||'sage';avatar.textContent='';const copy=document.createElement('span');copy.className='ts-account-copy';const name=document.createElement('span');name.className='ts-account-name';name.textContent=a.name;const handle=document.createElement('span');handle.className='ts-account-handle';handle.textContent='@'+a.handle;copy.append(name,handle);const dot=document.createElement('span');dot.className='ts-status-dot'+(a.enabled?'':' off');b.append(avatar,copy,dot);b.onclick=()=>{selected=a.id;render();persist();};box.append(b);});$('ts-add').disabled=accounts.length>=8;}
function nextPost(a){if(!a.enabled||!a.days.length||!a.times.length)return null;const now=new Date();const jst=new Date(now.getTime()+9*3600000);const midnight=Date.UTC(jst.getUTCFullYear(),jst.getUTCMonth(),jst.getUTCDate())-9*3600000;const candidates=[];for(let day=0;day<8;day++){const base=midnight+day*86400000;const weekday=(new Date(base+9*3600000).getUTCDay()+6)%7;if(a.days.includes(weekday))a.times.forEach(t=>{if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return;const [h,m]=t.split(':').map(Number);const stamp=base+(h*60+m)*60000;if(stamp>now.getTime())candidates.push(stamp);});}return candidates.length?new Date(Math.min(...candidates)):null;}
function renderSchedule(){const a=current();$('ts-enabled').setAttribute('aria-checked',String(a.enabled));$('ts-active-label').textContent=a.enabled?'定期投稿 ON':'定期投稿 OFF';$('ts-days').replaceChildren();$('ts-miniweek').replaceChildren();weekdays.forEach((d,i)=>{const b=document.createElement('button');b.className='ts-day';b.textContent=d;b.setAttribute('aria-pressed',String(a.days.includes(i)));b.setAttribute('aria-label',d+'曜日');b.onclick=()=>{a.days=a.days.includes(i)?a.days.filter(x=>x!==i):[...a.days,i].sort();mark();renderSchedule();icons();};$('ts-days').append(b);const mini=document.createElement('div');mini.className='ts-mini-day';mini.textContent=d;const dot=document.createElement('div');dot.className='ts-mini-dot'+(a.days.includes(i)&&a.enabled?' on':'');mini.append(dot);$('ts-miniweek').append(mini);});
$('ts-times').replaceChildren();a.times.forEach((t,i)=>{const chip=document.createElement('div');chip.className='ts-time-chip';const input=document.createElement('input');input.type='time';input.value=t;input.required=true;input.setAttribute('aria-label','投稿時刻 '+(i+1));input.onchange=()=>{a.times[i]=input.value;mark();renderSummary();};const remove=document.createElement('button');remove.className='ts-remove';remove.setAttribute('aria-label',t+'の投稿枠を削除');remove.append(icon('x'));remove.onclick=()=>{a.times.splice(i,1);mark();renderSchedule();icons();};chip.append(input,remove);$('ts-times').append(chip);});const add=document.createElement('button');add.className='ts-add-time';add.append(icon('plus'),document.createTextNode('時刻'));add.disabled=a.times.length>=6;add.onclick=()=>{const t=['08:00','12:00','15:00','18:00','20:00','22:00'].find(t=>!a.times.includes(t))||'09:00';a.times.push(t);mark();renderSchedule();icons();};$('ts-times').append(add);renderSummary();}
function renderSummary(){const a=current();$('ts-frequency').textContent=a.enabled?(a.days.length===7?'毎日':`週${a.days.length}日`)+`、1日${a.times.length}回投稿`:'定期投稿を一時停止しています';const next=nextPost(a);$('ts-next-time').textContent=!a.enabled?'一時停止':next?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(next):'未設定';$('ts-next-date').textContent=!a.enabled?'再開すると予定が表示されます':next?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'}).format(next)+' · JST':'曜日と時刻を設定してください';}
function render(){const a=current();renderAccounts();$('ts-name').textContent=a.name;$('ts-handle').textContent='@'+a.handle;$('ts-prompt').value=a.prompt;$('ts-prompt-count').textContent=a.prompt.length+' / 2,400';$('ts-preview-user').textContent=a.handle;$('ts-preview-avatar').textContent='';$('ts-preview-avatar').dataset.style=a.style||'sage';$('ts-preview-text').textContent=a.sample||'ここに、このアカウントの投稿イメージが表示されます。\n\nテーマや文体をプロンプトで設定してみましょう。';renderSchedule();setStatus(dirty?'未保存の変更があります':'');icons();}

$('ts-enabled').onclick=()=>{current().enabled=!current().enabled;mark();renderSchedule();renderAccounts();icons();};
$('ts-prompt').oninput=e=>{current().prompt=e.target.value;$('ts-prompt-count').textContent=e.target.value.length+' / 2,400';mark();};
$('ts-save').onclick=()=>{const invalid=accounts.find(a=>a.enabled&&(!a.days.length||!a.times.length||!a.prompt.trim()||a.times.some(t=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))||new Set(a.times).size!==a.times.length));if(invalid){$('ts-error').textContent=`「${invalid.name}」の曜日・時刻・プロンプトを設定し、重複する時刻を削除してください。`;$('ts-error').hidden=false;return;}saved=JSON.stringify(accounts);dirty=false;persist();$('ts-error').hidden=true;setStatus('設定を保存しました');};
$('ts-add').onclick=()=>{const show=$('ts-add-form').hidden;$('ts-add-form').hidden=!show;$('ts-add').setAttribute('aria-expanded',String(show));if(show)$('ts-new-name').focus();};
$('ts-add-form').onsubmit=e=>{e.preventDefault();const name=$('ts-new-name').value.trim(),handle=$('ts-new-handle').value.trim().replace(/^@/,'');if(!name||!/^[A-Za-z0-9_][A-Za-z0-9._]{0,29}$/.test(handle)){$('ts-add-error').textContent='名前と有効なユーザーネームを入力してください。';return;}if(accounts.some(a=>a.handle.toLowerCase()===handle.toLowerCase())){$('ts-add-error').textContent='このアカウントは追加済みです。';return;}if(accounts.length>=8)return;const a={id:'account-'+Date.now(),name,handle,glyph:name.slice(0,1),style:'sage',enabled:false,days:[0,1,2,3,4],times:['09:00'],prompt:'',sample:''};accounts.push(a);selected=a.id;$('ts-add-form').reset();$('ts-add-error').textContent='';$('ts-add-form').hidden=true;$('ts-add').setAttribute('aria-expanded','false');mark();render();};
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(!dirty&&validState(s)){restore(s);render();}});
render();
if(globalThis.Tweak){const design={corners:14,density:'ゆったり'};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--ts-radius',design.corners+'px');root.querySelectorAll('.ts-section').forEach(el=>el.style.padding=design.density==='コンパクト'?'16px':'22px');}});tweak.addSlider(design,'corners',{label:'パネルの丸み',min:4,max:22,unit:'px'});tweak.addSelect(design,'density',{label:'情報の余白',options:['ゆったり','コンパクト']});}
})();
</script>
